<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#F5F1EA" />
  <title>VELSOREN — Elegância sem excessos</title>
  <meta name="description" content="VELSOREN — essenciais contemporâneos com estética sofisticada, limpa e atemporal." />
  <style>
    :root{--bg:#F5F1EA;--surface:#fff;--ink:#1F1F1F;--muted:#6F6A63;--gold:#B8925A;--line:#E7DED2}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(920px,100%);background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:24px;padding:clamp(36px,7vw,78px);box-shadow:0 18px 60px rgba(31,31,31,.06);text-align:center}
    .mark{font-family:Georgia,'Times New Roman',serif;font-size:clamp(42px,8vw,92px);letter-spacing:.16em;margin-right:-.16em;line-height:1;color:var(--ink)}
    .rule{width:150px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:28px auto}
    h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(28px,4.5vw,50px);font-weight:400;margin:0 0 16px}
    h1 span{color:var(--gold)}
    p{color:var(--muted);font-size:clamp(16px,2vw,20px);line-height:1.7;margin:0 auto 30px;max-width:650px}
    a{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:16px 28px;border-radius:8px;font-weight:700;letter-spacing:.12em;font-size:14px}
    small{display:block;margin-top:22px;color:var(--muted)}
  </style>
  <script>
    const loja = 'https://velsoren.catalog.yampi.io/';
    window.setTimeout(() => window.location.replace(loja), 900);
  </script>
</head>
<body>
  <main>
    <div class="mark">VELSOREN</div>
    <div class="rule"></div>
    <h1><span>Elegância</span> sem excessos.</h1>
    <p>Você está sendo direcionado para a loja oficial VELSOREN.</p>
    <a href="https://velsoren.catalog.yampi.io/" rel="noopener">ENTRAR NA LOJA</a>
    <small>Se o redirecionamento não acontecer automaticamente, use o botão acima.</small>
  </main>
</body>
</html>
